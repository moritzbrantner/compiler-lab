name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features

  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Build shared project pages
        run: >-
          npm exec --yes
          --package=git+https://github.com/moritzbrantner/github-pages-template.git#d24d6fb63120a1087a6c7178e08a951d0c2ca060
          -- github-pages-template build
          --config ./site/pages.config.json
          --out ./dist
      - name: Verify generated routes and diagnostic runtime
        run: |
          test -f dist/index.html
          test -f dist/stats/index.html
          test -f dist/evidence/index.html
          test -f dist/project-pages.json
          test -f dist/assets/site-runtime.js
          test -f dist/assets/evidence-source.js
          grep -Fq 'Evidence revision' dist/assets/site-runtime.js
          grep -Fq 'Evidence identity and revision are current.' dist/assets/evidence-source.js
          grep -Fq 'repository-identity-mismatch' dist/assets/evidence-source.js

  merge-ready:
    name: merge-ready
    if: ${{ always() }}
    needs: ["rust", "pages"]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["rust", "pages"]'
